server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour les assets JS/CSS (reduit le temps de chargement)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets statiques avec cache long (Vite genere des noms de fichiers avec hash)
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing : toute URL inconnue renvoie index.html
    # Sans cette regle, recharger /overview ou /simulation renverrait un 404 Nginx.
    location / {
        try_files $uri /index.html;
    }
}
